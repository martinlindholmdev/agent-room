[package]
name = "agent-room-desktop"
version = "0.1.0"
description = "A persistent room for your existing agent conversations"
authors = ["Agent Room"]
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
